name: Dev

# Every push to a long-lived branch of the gitflow (main, develop, release/*,
# hotfix/*) and every pull request: analyze, test, and build a debug version for
# each desktop platform, kept as an artifact for a week.
on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: flutter build macos --debug
            path: build/macos/Build/Products/Debug/Flutter UI Builder.app
          - name: Windows
            os: windows-latest
            command: flutter build windows --debug
            path: build/windows/x64/runner/Debug
          - name: Linux
            os: ubuntu-latest
            command: flutter build linux --debug
            path: build/linux/x64/debug/bundle
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install the Linux build tools
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-ui-builder-dev-${{ matrix.name }}
          path: ${{ matrix.path }}
          retention-days: 7
